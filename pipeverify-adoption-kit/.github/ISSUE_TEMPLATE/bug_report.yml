name: Bug report
description: Something gave a wrong verdict, crashed, or behaved unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or config you ran, and the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Two tiny CSV files (before and after) that show the problem are the fastest way to a fix.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `pipeverify --version` and `python -c "import duckdb; print(duckdb.__version__)"`
    validations:
      required: true

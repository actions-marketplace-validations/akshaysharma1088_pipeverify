name: Feature request
description: A new check, source, integration or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What kind of bad change got through, or what is hard to set up today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options: ["Yes", "Maybe, with some guidance", "No"]
